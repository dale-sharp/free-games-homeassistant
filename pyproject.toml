[project]
name = "free-games-homeassistant"
version = "1.0.6"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-homeassistant-custom-component>=0.13.367",
    "ruff>=0.17.1",
    "josepy",
    "beautifulsoup4>=4.12.0",
    "lxml>=6.1.3",
    "ty>=0.0.89",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
log_cli = false

[tool.coverage.report]
# Overall floor documented in CONTRIBUTING.md. The per-module floor (~90%) can't be expressed
# here - it's enforced separately by scripts/check_coverage_floor.py against coverage.json.
fail_under = 95

[tool.ruff]
target-version = "py312"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
blanket-ignore-comment = "error"
# Home Assistant's cached-property metaclass makes ty see `native_value` and
# `extra_state_attributes` as writable attributes, so the standard read-only
# @property override pattern every HA entity uses is flagged. Not a real defect.
invalid-property-type-override = "ignore"
