[project]
name = "free-games-homeassistant"
version = "1.0.5"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-homeassistant-custom-component>=0.13.355",
    "ruff>=0.16.4",
    "josepy",
    "beautifulsoup4>=4.12.0",
    "lxml>=6.1.2",
    "ty>=0.0.74",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
log_cli = false

[tool.coverage.report]
# Overall floor documented in CONTRIBUTING.md. The per-module floor (~90%) can't be expressed
# here - it's enforced separately by scripts/check_coverage_floor.py against coverage.json.
fail_under = 95

[tool.ruff]
target-version = "py312"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
blanket-ignore-comment = "error"
